name: CI

on:
  push:
  pull_request:

jobs:
  bot:
    name: bot (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/bot
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest
